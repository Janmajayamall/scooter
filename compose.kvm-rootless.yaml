# KVM for pi's VMs under rootless Docker (8.3 of DESIGN.md), added to compose.yaml. In a .env file
# beside compose.yaml:
#
#   COMPOSE_FILE=compose.yaml:compose.kvm-rootless.yaml
#
# The runner runs as scooter-runner here too (D217). Rootless Docker gives the container's users
# uids of their own on the host, and the host's kvm group never reaches a container (13.4), so the
# host uid that scooter-runner (10002) is given needs access of its own to /dev/kvm. Ubuntu's device
# rules take a user's access to /dev/kvm away whenever a VM starts or stops, so a udev rule gives
# it back each time:
#
# 1. As the user that runs rootless Docker, the host uid of scooter-runner:
#      docker run --rm --entrypoint awk scooter:local '$1 <= 10002 && 10002 < $1 + $3 { print $2 + 10002 - $1 }' /proc/self/uid_map
# 2. With that number in place of <uid>, as root:
#      echo 'SUBSYSTEM=="misc", KERNEL=="kvm", RUN+="/usr/bin/setfacl -m u:<uid>:rw $devnode"' > /etc/udev/rules.d/99-scooter-kvm.rules
#      udevadm control --reload && udevadm trigger --action=change --name-match=kvm
#    `getfacl /dev/kvm` then lists user:<uid>:rw-. setfacl is in the acl package.
#
# Then `docker compose up -d`, and `docker compose run --rm runner doctor` reports KVM.

services:
  runner:
    devices:
      - /dev/kvm:/dev/kvm

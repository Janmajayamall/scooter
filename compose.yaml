# Scooter in Docker Compose: one image, two services, and no published port.
#
#   cp bridge.env.example bridge.env && cp runner.env.example runner.env    then fill them in
#   docker compose build
#   docker compose run --rm build-image          the VM image pi runs in, into the data volume
#   docker compose up -d
#   docker compose run --rm runner doctor        what the runner has, and how to enable KVM
#
# Other commands run the same way: `docker compose run --rm bridge pair`, `… bridge status`,
# `… bridge backup-init`, `… runner rebuild lifelog` with the runner stopped, `… bridge restore`
# with both stopped.
#
# - **The data.** One volume, `data`, holds the whole data folder, at /data in every container.
#   A new volume starts as a copy of the image's /data, whose folders have the same owners and modes
#   as natively, and those keep each user out of the others' folders: the runner, as
#   scooter-runner, reads the datastore and can't read the bridge's, wacli's or the email reader's
#   folders. `build-image` builds beside runner/ in the same volume, and renames the image in.
# - **The config** is the repository's ./config, read-only, which only the runner and build-image
#   see. Its files must be readable by other users of the host, as git leaves them.
# - **The env files**, bridge.env and runner.env beside this file, each given to its own service
#   alone.
# - **KVM.** This file runs pi's VMs under emulation, which works everywhere and is about ten
#   times slower. To use KVM, add the file of your case, by naming both in COMPOSE_FILE in a .env
#   file beside this one, which every `docker compose` command here then reads:
#     compose.kvm.yaml            rootful Docker, the usual install: COMPOSE_FILE=compose.yaml:compose.kvm.yaml
#     compose.kvm-rootless.yaml   rootless Docker, with the udev rule it describes
#   `docker compose run --rm runner doctor` says which case applies.
# - **build-image** runs as root, with the privileges Gondolin's builder needs to make its chroot,
#   in a container of its own that `docker compose up` doesn't start.

name: scooter

x-scooter: &scooter
  build: .
  image: scooter:local
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"
  environment:
    DATA_DIR: /data
    CONFIG_DIR: /config

services:
  # Runs as root, as natively, and starts wacli and the email reader as their own users. Its
  # hostname is the same from one container to the next, so restic knows a lock it left.
  bridge:
    <<: *scooter
    command: [bridge]
    hostname: scooter
    env_file: bridge.env
    volumes:
      - data:/data

  # Runs as scooter-runner, with a read-only root file system: it writes only in the data volume,
  # and in /tmp. It is the container's main process, so its VMs stop with it.
  runner:
    <<: *scooter
    command: [runner]
    user: scooter-runner
    env_file: runner.env
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - data:/data
      - ./config:/config:ro

  # `docker compose run --rm build-image`, after installing and after each upgrade, with the
  # runner stopped. As root, Gondolin's builder makes a chroot with /proc and /dev mounted
  # in it, which a container may do only when privileged: under rootful Docker that is root on the
  # host, as a native build is.
  build-image:
    <<: *scooter
    profiles: [build-image]
    command: [build-image]
    user: root
    privileged: true
    restart: "no"
    volumes:
      - data:/data
      - ./config:/config:ro

volumes:
  data:
